[project]
name = "project-template"
version = "0.1.0"
description = "FastAPI + static HTML project template"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff.lint]
# B008 flags `Depends(...)` in argument defaults, which is the standard
# FastAPI dependency-injection pattern, not a bug — ignore it.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
